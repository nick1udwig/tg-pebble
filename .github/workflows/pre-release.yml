name: Pre-Release

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl1.2debian \
            libsdl2-2.0-0 \
            libfdt1 \
            python3.12-venv \
            xvfb \
            xauth

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install pebble-tool
        run: |
          uv tool install pebble-tool --python 3.12
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Pebble SDK
        run: |
          pebble sdk install latest
          sdk_include_path="$(pebble sdk include-path basalt)"
          sdk_root="$(realpath "${sdk_include_path}/../../../..")"
          test -x "${sdk_root}/toolchain/bin/qemu-pebble"
          echo "TG_PEBBLE_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"

      - name: Run JS tests
        run: npm run test:js

      - name: Check Telegram schema metadata
        run: npm run check:tl-schema

      - name: Run C tests
        run: npm run test:c

      - name: Run config-page tests
        run: npm run test:config

      - name: Run emulator matrix
        run: env TG_PEBBLE_SESSION_GUARDED=1 bash scripts/test-emulator-matrix.sh

      - name: Run emulator zero-state coverage
        run: env TG_PEBBLE_SESSION_GUARDED=1 bash scripts/test-emulator-states.sh "${TG_PEBBLE_STATE_PLATFORM:-basalt}"

      - name: Run emulator relaunch coverage
        run: env TG_PEBBLE_SESSION_GUARDED=1 bash scripts/test-emulator-relaunch.sh "${TG_PEBBLE_RELAUNCH_PLATFORM:-basalt}"

      - name: Review visual diffs
        run: bash scripts/review-visual-diffs.sh

      - name: Run emulator soak
        run: env TG_PEBBLE_SESSION_GUARDED=1 bash scripts/test-emulator-soak.sh "${TG_PEBBLE_SOAK_ITERATIONS:-2}" "${TG_PEBBLE_SOAK_PLATFORM:-basalt}"

      - name: Upload emulator and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-artifacts
          path: |
            build/tests
            tests/emulator/artifacts
          if-no-files-found: ignore
          retention-days: 7
